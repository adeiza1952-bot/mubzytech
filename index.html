<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MUBZY TECH - Maintenance</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 30px;
      max-width: 600px;
      animation: fadeIn 1.5s ease-in-out;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 10px;
      color: #38bdf8;
    }

    .tag {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      opacity: 0.8;
      margin-bottom: 25px;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }

    .box {
      background: rgba(255,255,255,0.05);
      padding: 15px;
      border-radius: 10px;
      min-width: 70px;
      backdrop-filter: blur(10px);
    }

    .box span {
      font-size: 20px;
      font-weight: bold;
      display: block;
    }

    .box small {
      opacity: 0.6;
    }

    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: #38bdf8;
      filter: blur(150px);
      opacity: 0.15;
      top: -100px;
      animation: float 6s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(40px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      opacity: 0.5;
    }
  </style>
</head>

<body>
  <div class="glow"></div>

  <div class="container">
    <div class="logo">MUBZY TECH</div>
    <div class="tag">Learning Platform • Future of Tech Education</div>

    <h1>🚧 We’re Under Maintenance</h1>
    <p>We’re upgrading the platform to bring you a faster, smarter learning experience.</p>

    <div class="countdown">
      <div class="box">
        <span id="days">0</span>
        <small>Days</small>
      </div>
      <div class="box">
        <span id="hours">0</span>
        <small>Hours</small>
      </div>
      <div class="box">
        <span id="minutes">0</span>
        <small>Min</small>
      </div>
      <div class="box">
        <span id="seconds">0</span>
        <small>Sec</small>
      </div>
    </div>

    <div class="footer">
      © 2026 MUBZY TECH • All rights reserved
    </div>
  </div>

  <script>
    // Set target date (change this if you want)
    const targetDate = new Date();
    targetDate.setDate(targetDate.getDate() + 3); // 3 days from now

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("days").innerText = days;
      document.getElementById("hours").innerText = hours;
      document.getElementById("minutes").innerText = minutes;
      document.getElementById("seconds").innerText = seconds;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
